<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2F5D3A">
<meta name="mobile-web-app-capable" content="yes">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Planilla de Notas</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: una sola pantalla. Barra superior, resumen, planilla con encabezado y columnas fijas, barra de acciones abajo. */
:root{
  --bg:#F2F5F0; --surface:#FFFFFF; --band:#EAF3E7; --ink:#1B2A20; --muted:#5C6C61; --line:#D3DDD0;
  --head:#2F5D3A; --head-ink:#FFFFFF; --ok-bg:#D9EDD4; --ok-ink:#1B4A27; --bad-bg:#F8DAD5; --bad-ink:#8A2B22;
  --focus:#2563EB; --scrim:rgba(14,24,17,.5);
  --mono:"IBM Plex Mono","Courier New",monospace; --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111913; --surface:#18231B; --band:#1D2B21; --ink:#E5EEE7; --muted:#92A497; --line:#2A3A2F;
  --head:#2E5C3A; --head-ink:#FFFFFF; --ok-bg:#1F3E28; --ok-ink:#BFE6C8; --bad-bg:#4B2622; --bad-ink:#F4BDB6;
  --focus:#6EA0FF; --scrim:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111913; --surface:#18231B; --band:#1D2B21; --ink:#E5EEE7; --muted:#92A497; --line:#2A3A2F;
  --head:#2E5C3A; --head-ink:#FFFFFF; --ok-bg:#1F3E28; --ok-ink:#BFE6C8; --bad-bg:#4B2622; --bad-ink:#F4BDB6;
  --focus:#6EA0FF; --scrim:rgba(0,0,0,.6); color-scheme:dark}

html{box-sizing:border-box;height:100%}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
.app{height:100%;display:flex;flex-direction:column;gap:8px;min-height:0}

/* barra superior */
.top{display:flex;align-items:center;gap:10px}
.title{flex:1;min-width:0;display:flex;align-items:center;gap:8px;text-align:left;background:none;border:0;padding:4px 0}
.title .t{min-width:0}
.title b{display:block;font:700 17px/1.15 var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.title small{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-transform:uppercase;letter-spacing:.04em}
.title svg{flex:none;width:18px;height:18px;stroke:var(--muted)}
.save{flex:none;display:flex;align-items:center;gap:6px;font:500 11px var(--mono);color:var(--muted)}
.save i{width:8px;height:8px;border-radius:50%;background:var(--head)}
.save.busy i{background:#C98A1B}
.meta{font:500 11px/1.45 var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.03em}

/* aviso */
.note{display:flex;align-items:center;gap:10px;background:var(--band);border:1px solid var(--line);border-radius:6px;padding:8px 10px;font-size:13px;line-height:1.35}
.note p{margin:0;flex:1;min-width:0}
.note button{flex:none}

/* planilla */
.wrap{flex:1;min-height:0;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:6px;-webkit-overflow-scrolling:touch}
table{border-collapse:separate;border-spacing:0;font-variant-numeric:tabular-nums}
th,td{padding:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--surface)}
thead th{position:sticky;top:0;z-index:3;background:var(--head);color:var(--head-ink);border-color:rgba(255,255,255,.18);font:600 11px var(--mono);text-transform:uppercase}
.c-nro{position:sticky;left:0;z-index:2;width:34px;min-width:34px;text-align:center;font:500 12px var(--mono);color:var(--muted)}
.c-name{position:sticky;left:34px;z-index:2;width:138px;min-width:138px;max-width:138px;box-shadow:2px 0 0 var(--line)}
thead .c-nro,thead .c-name{z-index:5;color:var(--head-ink);height:104px;vertical-align:bottom;padding:0 6px 8px}
thead .c-name{text-align:left}
tbody tr:nth-child(odd) .c-nro,tbody tr:nth-child(odd) .c-name{background:var(--band)}
.c-act{width:48px;min-width:48px}
thead .c-act{height:104px;padding:0}
.vh{display:block;width:100%;height:104px;background:none;border:0;color:inherit;padding:8px 0;writing-mode:vertical-rl;transform:rotate(180deg);text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font:600 11px var(--mono);letter-spacing:.03em}
.nm{display:block;width:100%;min-height:36px;background:none;border:0;text-align:left;padding:5px 6px;font-size:11.5px;line-height:1.2;text-transform:uppercase}
input.g{display:block;width:100%;height:36px;border:0;border-radius:0;background:transparent;text-align:center;font:600 13px var(--mono);padding:0}
input.g:focus{outline:2px solid var(--focus);outline-offset:-2px}
td.ok{background:var(--ok-bg);color:var(--ok-ink)} td.bad{background:var(--bad-bg);color:var(--bad-ink)}
.empty{padding:32px 20px;text-align:center;color:var(--muted);display:grid;gap:12px;justify-items:center}
.empty b{font:700 15px var(--mono);color:var(--ink)}

/* barra de acciones */
.bar{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bar button{display:flex;align-items:center;justify-content:center;gap:8px;min-height:46px;background:var(--surface);border:1px solid var(--line);border-radius:6px;font-weight:600;font-size:14px}
.bar svg,.btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* hojas inferiores */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-width:560px;margin:0 auto;max-height:88%;display:flex;flex-direction:column;background:var(--surface);border-radius:14px 14px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.25);animation:up .2s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.sheet header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px))}
.sheet h2{margin:0;font:700 16px var(--mono)}
.x{width:40px;height:40px;border:0;background:none;font-size:26px;line-height:1;color:var(--muted)}
.sbody{overflow:auto;display:grid;gap:12px;align-content:start;padding:4px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
label{display:grid;gap:4px;font-size:12px;font-weight:500;color:var(--muted)}
label input,label select,label textarea,.sbody textarea{width:100%;min-height:44px;padding:9px 10px;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px}
textarea{min-height:140px;font:500 13px/1.4 var(--mono);resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chk{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--ink)}
.chk input{width:20px;height:20px;min-height:0;accent-color:var(--head)}
.hint{margin:0;font-size:13px;line-height:1.45;color:var(--muted)}
.actions{display:grid;gap:8px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 14px;border-radius:6px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:15px}
.btn.primary{background:var(--head);border-color:var(--head);color:var(--head-ink)}
.btn.danger{color:var(--bad-ink);border-color:var(--bad-bg);background:var(--bad-bg)}
.btn.sm{min-height:36px;font-size:13px}
.list{display:grid;gap:6px}
.pick{display:flex;align-items:center;gap:10px;width:100%;text-align:left;min-height:52px;padding:8px 12px;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
.pick[aria-current="true"]{border-color:var(--head);background:var(--band)}
.pick b{display:block;font:700 14px var(--mono)} .pick small{display:block;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.03em}
.pick .tick{margin-left:auto;font-weight:700;color:var(--head)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.seg label{display:flex;align-items:center;gap:8px;min-height:44px;padding:0 10px;border:1px solid var(--line);border-radius:6px;font-size:14px;color:var(--ink)}
.seg input{width:18px;height:18px;min-height:0;accent-color:var(--head)}
.toast{pointer-events:none;position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:30;max-width:90%;background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:6px;font-size:14px}
</style>

</head>
<body>
<div class="app">
  <div class="top">
    <button class="title" id="bookBtn" aria-label="Cambiar de planilla">
      <span class="t"><b id="tCurso"></b><small id="tSub"></small></span>
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
    </button>
    <div class="save" id="save" role="status"><i></i><span id="saveTxt"></span></div>
  </div>
  <div class="meta" id="meta"></div>
  <div class="note" id="note" hidden>
    <p>Estás viendo datos de ejemplo. Pega tu lista de estudiantes para empezar con tu curso.</p>
    <button class="btn primary sm" id="noteBtn">Pegar lista</button>
  </div>
  <div class="wrap" id="grid"></div>
  <div class="bar">
    <button id="bStu"><svg viewBox="0 0 24 24"><path d="M16 19v-1.5a3.5 3.5 0 0 0-3.5-3.5h-5A3.5 3.5 0 0 0 4 17.5V19"/><circle cx="10" cy="8" r="3.2"/><path d="M20 19v-1.2a3 3 0 0 0-2.2-2.9M15.5 5.2a3.2 3.2 0 0 1 0 5.6"/></svg>Estudiantes</button>
    <button id="bAct"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Actividad</button>
    <button id="bExp"><svg viewBox="0 0 24 24"><path d="M12 4v11M7.5 10.5 12 15l4.5-4.5M5 19h14"/></svg>Exportar</button>
  </div>
</div>

<div class="scrim" id="scrim" hidden></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden>
  <header><h2 id="sheetTitle"></h2><button class="x" id="sheetX" aria-label="Cerrar">×</button></header>
  <div class="sbody" id="sbody"></div>
</section>
<div class="toast" id="toast" role="status" hidden></div>

<script>
(function(){
  var LS = 'planilla-notas-v1';
  var $ = function(s){ return document.querySelector(s); };
  var uid = function(){ return Math.random().toString(36).slice(2, 9); };
  var esc = function(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); };
  var S, dbDoc = null, dl = null;
  var timer = null, saving = false, dirty = false;

  /* ---------- datos ---------- */
  function sample(){
    var acts = [19,20,21,22,23,24].map(function(n){ return {id: uid(), name: 'ACTIVIDAD ' + n}; });
    var names = ['AGUILAR MAMANI ANA LUCÍA','CONDORI QUISPE JOSÉ LUIS','FLORES TICONA MARÍA ELENA','MAMANI CHOQUE CARLOS DAVID','QUISPE APAZA VALERIA SOFÍA','TORREZ LIMA DIEGO ARMANDO'];
    var g = [[75,100,null,100,100,70],[60,100,100,90,60,100],[100,100,100,100,100,80],[90,100,35,70,100,90],[null,90,null,null,45,null],[100,100,100,100,100,100]];
    var students = [], grades = {};
    names.forEach(function(n, i){
      var id = uid(); students.push({id: id, name: n}); grades[id] = {};
      g[i].forEach(function(v, j){ if (v != null) grades[id][acts[j].id] = v; });
    });
    var bid = uid();
    return {v: 1, cur: bid, sample: true, updatedAt: 0, books: [{
      id: bid, curso: '1ro "A" Secundaria', unidad: '"LOS ANDES MAÑANA"', prof: 'DANIEL CANAVIRI',
      area: 'COMPUTACIÓN', gestion: '2026', trim: '3er TRIMESTRE', min: 51, students: students, acts: acts, grades: grades
    }]};
  }
  function book(){ return S.books.filter(function(b){ return b.id === S.cur; })[0] || S.books[0]; }
  function avg(b, sid){
    var g = b.grades[sid] || {}, s = 0, n = 0;
    b.acts.forEach(function(a){ var v = g[a.id]; if (typeof v === 'number'){ s += v; n++; } });
    return n ? s / n : null;
  }
  function actAvg(b, aid){
    var s = 0, n = 0;
    b.students.forEach(function(st){ var v = (b.grades[st.id] || {})[aid]; if (typeof v === 'number'){ s += v; n++; } });
    return n ? s / n : null;
  }
  function cls(v, min){ return v == null ? '' : (v >= min ? 'ok' : 'bad'); }
  function fmt(v){ return v == null ? '' : String(Math.round(v)); }
  function nextActNumber(b){
    var m = 0;
    b.acts.forEach(function(a){ var x = /(\d+)\s*$/.exec(a.name); if (x) m = Math.max(m, parseInt(x[1], 10)); });
    return m ? m + 1 : b.acts.length + 1;
  }

  /* ---------- guardado ---------- */
  function setStatus(t, busy){ $('#saveTxt').textContent = t; $('#save').classList.toggle('busy', !!busy); }
  function saveLocal(){ try { localStorage.setItem(LS, JSON.stringify(S)); } catch(e){} }
  function schedule(){
    S.updatedAt = Date.now(); dirty = true; saveLocal();
    setStatus('Guardando…', true);
    clearTimeout(timer); timer = setTimeout(flush, 700);
  }
  function flush(){
    if (saving){ timer = setTimeout(flush, 400); return; }
    if (!dirty) return;
    dirty = false;
    if (!dbDoc){ setStatus('Solo en este teléfono'); return; }
    saving = true;
    dbDoc.set({v: 1, updatedAt: S.updatedAt, data: JSON.parse(JSON.stringify(S))}).then(function(){
      saving = false; setStatus(dirty ? 'Guardando…' : 'Guardado', dirty); if (dirty) schedule();
    }, function(){
      saving = false; setStatus('Solo en este teléfono');
    });
  }
  document.addEventListener('visibilitychange', function(){ if (document.hidden && dirty) flush(); });

  /* ---------- pintado ---------- */
  function renderHead(){
    var b = book();
    $('#tCurso').textContent = b.curso || 'Sin nombre';
    $('#tSub').textContent = [b.area, b.trim].filter(Boolean).join(' · ');
    var m = [];
    if (b.unidad) m.push('Unidad ' + b.unidad);
    if (b.prof) m.push('Prof. ' + b.prof);
    if (b.gestion) m.push('Gestión ' + b.gestion);
    $('#meta').textContent = m.join(' · ');
    document.title = 'Planilla de Notas';
    $('#note').hidden = !S.sample;
  }
  function renderTable(){
    var b = book(), wrap = $('#grid'), sl = wrap.scrollLeft, st = wrap.scrollTop;
    if (!b.students.length){
      wrap.innerHTML = '<div class="empty"><b>Aún no hay estudiantes</b><span>Pega la lista desde Excel o escribe los nombres, uno por línea.</span><button class="btn primary" id="emptyBtn">Agregar estudiantes</button></div>';
      $('#emptyBtn').addEventListener('click', openStudents);
      return;
    }
    var h = '<table><thead><tr><th class="c-nro">Nro</th><th class="c-name">Apellidos y nombres</th>';
    b.acts.forEach(function(a){ h += '<th class="c-act"><button class="vh" data-a="' + a.id + '" title="Editar actividad">' + esc(a.name) + '</button></th>'; });
    h += '</tr></thead><tbody>';
    b.students.forEach(function(s, i){
      var g = b.grades[s.id] || {};
      h += '<tr data-s="' + s.id + '"><td class="c-nro">' + (i + 1) + '</td><td class="c-name"><button class="nm" data-s="' + s.id + '">' + esc(s.name) + '</button></td>';
      b.acts.forEach(function(ac){
        var v = g[ac.id];
        h += '<td class="' + cls(v, b.min) + '"><input class="g" inputmode="numeric" pattern="[0-9]*" maxlength="3" enterkeyhint="next" autocomplete="off" data-s="' + s.id + '" data-a="' + ac.id + '" value="' + (typeof v === 'number' ? v : '') + '" aria-label="' + esc(s.name + ', ' + ac.name) + '"></td>';
      });
      h += '</tr>';
    });
    h += '</tbody></table>';
    wrap.innerHTML = h;
    wrap.scrollLeft = sl; wrap.scrollTop = st;
  }
  function render(){ renderHead(); renderTable(); }

  /* ---------- edición de notas en la planilla ---------- */
  var grid = $('#grid');
  grid.addEventListener('input', function(e){
    var t = e.target; if (!t.matches || !t.matches('input.g')) return;
    var b = book(), raw = t.value.replace(/\D/g, ''), n = raw === '' ? null : Math.min(100, parseInt(raw, 10));
    t.value = n === null ? '' : String(n);
    var g = b.grades[t.dataset.s] || (b.grades[t.dataset.s] = {});
    if (n === null) delete g[t.dataset.a]; else g[t.dataset.a] = n;
    t.parentNode.className = cls(n, b.min);
    schedule();
  });
  grid.addEventListener('focusin', function(e){ if (e.target.matches && e.target.matches('input.g')) setTimeout(function(){ try { e.target.select(); } catch(x){} }, 0); });
  grid.addEventListener('keydown', function(e){
    if (e.key !== 'Enter' || !e.target.matches('input.g')) return;
    e.preventDefault();
    var rows = Array.prototype.slice.call(grid.querySelectorAll('tbody tr')), i = rows.indexOf(e.target.closest('tr'));
    var nx = rows[i + 1] && rows[i + 1].querySelector('input[data-a="' + e.target.dataset.a + '"]');
    (nx || e.target).focus();
  });
  grid.addEventListener('click', function(e){
    var nm = e.target.closest('.nm'); if (nm){ openStudent(nm.dataset.s); return; }
    var vh = e.target.closest('.vh'); if (vh){ openAct(vh.dataset.a); }
  });

  /* ---------- hojas ---------- */
  var sheet = $('#sheet'), scrim = $('#scrim'), sbody = $('#sbody');
  function openSheet(title, html){
    $('#sheetTitle').textContent = title; sbody.innerHTML = html;
    scrim.hidden = false; sheet.hidden = false; sbody.scrollTop = 0;
    return sbody;
  }
  function closeSheet(){ sheet.hidden = true; scrim.hidden = true; sbody.innerHTML = ''; }
  scrim.addEventListener('click', closeSheet); $('#sheetX').addEventListener('click', closeSheet);
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape' && !sheet.hidden) closeSheet(); });
  var toastT;
  function toast(t){ var el = $('#toast'); el.textContent = t; el.hidden = false; clearTimeout(toastT); toastT = setTimeout(function(){ el.hidden = true; }, 2200); }
  function twoTap(btn, label, fn){
    var armed = false, t;
    btn.addEventListener('click', function(){
      if (!armed){ armed = true; btn.textContent = 'Toca otra vez para confirmar'; t = setTimeout(function(){ armed = false; btn.textContent = label; }, 3500); }
      else { clearTimeout(t); fn(); }
    });
  }
  var v = function(id){ return $(id).value.trim(); };

  /* planillas */
  function openBooks(){
    var h = '<div class="list">' + S.books.map(function(b){
      return '<button class="pick" data-b="' + b.id + '"' + (b.id === S.cur ? ' aria-current="true"' : '') + '><span><b>' + esc(b.curso || 'Sin nombre') + '</b><small>' + esc([b.area, b.trim].filter(Boolean).join(' · ')) + '</small></span>' + (b.id === S.cur ? '<span class="tick">✓</span>' : '') + '</button>';
    }).join('') + '</div><div class="actions"><button class="btn primary" id="bNew">Nueva planilla</button><button class="btn" id="bEdit">Editar datos de esta planilla</button></div>';
    var el = openSheet('Mis planillas', h);
    el.querySelectorAll('.pick').forEach(function(p){ p.addEventListener('click', function(){ S.cur = p.dataset.b; schedule(); render(); closeSheet(); }); });
    $('#bNew').addEventListener('click', function(){ openBookForm(true); });
    $('#bEdit').addEventListener('click', function(){ openBookForm(false); });
  }
  function bookForm(b, isNew){
    var trims = ['1er TRIMESTRE','2do TRIMESTRE','3er TRIMESTRE']; if (trims.indexOf(b.trim) < 0) trims.push(b.trim);
    return '<label>Curso<input id="f-curso" value="' + esc(b.curso) + '" placeholder="Ej. 2do &quot;B&quot; Secundaria" autocomplete="off"></label>' +
      '<label>Área<input id="f-area" value="' + esc(b.area) + '" autocomplete="off"></label>' +
      '<div class="two"><label>Trimestre<select id="f-trim">' + trims.map(function(t){ return '<option' + (t === b.trim ? ' selected' : '') + '>' + esc(t) + '</option>'; }).join('') + '</select></label>' +
      '<label>Gestión<input id="f-gestion" inputmode="numeric" value="' + esc(b.gestion) + '"></label></div>' +
      '<label>Unidad<input id="f-unidad" value="' + esc(b.unidad) + '" autocomplete="off"></label>' +
      '<label>Profesor<input id="f-prof" value="' + esc(b.prof) + '" autocomplete="off"></label>' +
      '<label>Nota mínima para aprobar<input id="f-min" inputmode="numeric" value="' + esc(b.min) + '"></label>' +
      (isNew ? '<label class="chk"><input type="checkbox" id="f-copy"> Copiar los estudiantes de la planilla actual (útil para el siguiente trimestre)</label>' : '') +
      '<div class="actions"><button class="btn primary" id="f-save">' + (isNew ? 'Crear planilla' : 'Guardar cambios') + '</button>' + (isNew ? '' : '<button class="btn danger" id="f-del">Eliminar planilla</button>') + '</div>';
  }
  function readBook(b){
    b.curso = v('#f-curso'); b.area = v('#f-area'); b.trim = $('#f-trim').value; b.gestion = v('#f-gestion');
    b.unidad = v('#f-unidad'); b.prof = v('#f-prof');
    var m = parseInt(v('#f-min'), 10); b.min = isNaN(m) ? 51 : Math.max(1, Math.min(100, m));
  }
  function openBookForm(isNew){
    var cur = book(), b;
    if (isNew){
      var ti = ['1er TRIMESTRE','2do TRIMESTRE','3er TRIMESTRE'].indexOf(cur.trim);
      b = {id: uid(), curso: '', unidad: '', prof: cur.prof, area: cur.area, gestion: cur.gestion, trim: ti >= 0 && ti < 2 ? ['1er TRIMESTRE','2do TRIMESTRE','3er TRIMESTRE'][ti + 1] : cur.trim, min: cur.min, students: [], acts: [], grades: {}};
    } else b = cur;
    openSheet(isNew ? 'Nueva planilla' : 'Datos de la planilla', bookForm(b, isNew));
    $('#f-save').addEventListener('click', function(){
      readBook(b);
      if (isNew && !b.curso){ toast('Escribe el nombre del curso'); $('#f-curso').focus(); return; }
      if (isNew){
        if ($('#f-copy').checked) cur.students.forEach(function(s){ var id = uid(); b.students.push({id: id, name: s.name}); b.grades[id] = {}; });
        b.acts.push({id: uid(), name: 'ACTIVIDAD 1'});
        S.books.push(b); S.cur = b.id; S.sample = false;
      }
      schedule(); render(); closeSheet();
      if (isNew) toast('Planilla creada: ' + b.curso);
    });
    if (!isNew) twoTap($('#f-del'), 'Eliminar planilla', function(){
      if (S.books.length < 2){ toast('Debe quedar al menos una planilla'); return; }
      S.books = S.books.filter(function(x){ return x.id !== b.id; }); S.cur = S.books[0].id;
      schedule(); render(); closeSheet();
    });
  }

  /* estudiantes */
  function parseList(text){
    var out = [];
    text.split(/\r?\n/).forEach(function(line){
      if (!line.trim()) return;
      var c = line.split('\t').map(function(x){ return x.trim(); });
      if (c.length > 1 && /^\d+$/.test(c[0]) && c[1] && !/^\d+$/.test(c[1])) c.shift();
      else if (c.length === 1) c = [c[0].replace(/^\d+[\.\)\-]?\s+/, '')];
      var name = c[0];
      if (!name || !/[A-Za-zÁÉÍÓÚÑáéíóúñ]/.test(name) || /^apellidos/i.test(name)) return;
      var g = c.slice(1).map(function(x){ var n = parseFloat(x.replace(',', '.')); return isNaN(n) ? null : Math.max(0, Math.min(100, Math.round(n))); });
      out.push({name: name, g: g});
    });
    return out;
  }
  function importList(list, replace){
    var b = book();
    if (replace){ b.students = []; b.grades = {}; }
    var cols = list.reduce(function(m, x){ return Math.max(m, x.g.length); }, 0);
    if (cols > b.acts.length){ var n = nextActNumber(b); for (var i = b.acts.length; i < cols; i++) b.acts.push({id: uid(), name: 'ACTIVIDAD ' + (n++)}); }
    list.forEach(function(x){
      var id = uid(); b.students.push({id: id, name: x.name}); var g = {};
      x.g.forEach(function(val, i){ if (val != null && b.acts[i]) g[b.acts[i].id] = val; });
      b.grades[id] = g;
    });
    S.sample = false; schedule(); render();
  }
  function openStudents(){
    var def = S.sample || !book().students.length;
    openSheet('Estudiantes',
      '<p class="hint">Escribe un nombre por línea, o copia la planilla de Excel y pégala aquí. Si pegas columnas con notas, se cargan en las actividades en orden.</p>' +
      '<textarea id="paste" placeholder="ALANOCA LEON KADISHA AZRIEL&#10;ALIAGA COCARICO NAYELI" autocomplete="off" spellcheck="false"></textarea>' +
      '<div class="seg"><label><input type="radio" name="mode" value="add"' + (def ? '' : ' checked') + '> Agregar al final</label><label><input type="radio" name="mode" value="rep"' + (def ? ' checked' : '') + '> Reemplazar lista</label></div>' +
      '<div class="actions"><button class="btn primary" id="doImp">Cargar lista</button></div>');
    $('#doImp').addEventListener('click', function(){
      var list = parseList($('#paste').value);
      if (!list.length){ toast('No encontré nombres para cargar'); return; }
      var rep = document.querySelector('input[name="mode"]:checked').value === 'rep';
      importList(list, rep); closeSheet(); toast(list.length + (list.length === 1 ? ' estudiante cargado' : ' estudiantes cargados'));
    });
  }
  function openStudent(sid){
    var b = book(), s = b.students.filter(function(x){ return x.id === sid; })[0]; if (!s) return;
    openSheet('Estudiante',
      '<label>Apellidos y nombres<input id="sn" value="' + esc(s.name) + '" autocomplete="off"></label>' +
      '<div class="actions"><button class="btn primary" id="sSave">Guardar</button><button class="btn danger" id="sDel">Quitar de la lista</button></div>');
    $('#sSave').addEventListener('click', function(){ var n = v('#sn'); if (!n){ toast('Escribe un nombre'); return; } s.name = n; schedule(); render(); closeSheet(); });
    twoTap($('#sDel'), 'Quitar de la lista', function(){
      b.students = b.students.filter(function(x){ return x.id !== sid; }); delete b.grades[sid];
      schedule(); render(); closeSheet();
    });
  }

  /* actividades */
  function openAct(aid){
    var b = book(), a = aid ? b.acts.filter(function(x){ return x.id === aid; })[0] : null;
    openSheet(a ? 'Actividad' : 'Nueva actividad',
      '<label>Nombre<input id="an" value="' + esc(a ? a.name : 'ACTIVIDAD ' + nextActNumber(b)) + '" autocomplete="off"></label>' +
      '<div class="actions"><button class="btn primary" id="aSave">' + (a ? 'Guardar' : 'Agregar actividad') + '</button>' + (a ? '<button class="btn danger" id="aDel">Eliminar actividad y sus notas</button>' : '') + '</div>');
    $('#aSave').addEventListener('click', function(){
      var n = v('#an'); if (!n){ toast('Escribe un nombre'); return; }
      if (a) a.name = n; else b.acts.push({id: uid(), name: n});
      schedule(); render(); closeSheet();
      if (!a){ var w = $('#grid'); setTimeout(function(){ w.scrollLeft = w.scrollWidth; }, 0); }
    });
    if (a) twoTap($('#aDel'), 'Eliminar actividad y sus notas', function(){
      b.acts = b.acts.filter(function(x){ return x.id !== aid; });
      Object.keys(b.grades).forEach(function(k){ delete b.grades[k][aid]; });
      schedule(); render(); closeSheet();
    });
  }

  /* exportar */
  function tableRows(b){
    var head = ['Nro', 'APELLIDOS Y NOMBRES'].concat(b.acts.map(function(a){ return a.name; }));
    var rows = b.students.map(function(s, i){
      var g = b.grades[s.id] || {};
      return [i + 1, s.name].concat(b.acts.map(function(a){ return typeof g[a.id] === 'number' ? g[a.id] : ''; }));
    });
    return [head].concat(rows);
  }
  function slug(t){ return String(t || '').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^A-Za-z0-9]+/g, '_').replace(/^_|_$/g, '').toLowerCase(); }
  function csvCell(x){ x = String(x); return /[;"\n\r]/.test(x) ? '"' + x.replace(/"/g, '""') + '"' : x; }
  function openExport(){
    var b = book(), rows = tableRows(b);
    var tsv = rows.map(function(r){ return r.join('\t'); }).join('\n');
    openSheet('Exportar notas',
      '<p class="hint">Copia la tabla y pégala en Excel o Google Sheets. También puedes guardar un archivo CSV.</p>' +
      '<textarea id="tsv" readonly spellcheck="false">' + esc(tsv) + '</textarea>' +
      '<div class="actions"><button class="btn primary" id="xCopy">Copiar tabla</button>' + (dl ? '<button class="btn" id="xCsv">Guardar archivo CSV</button>' : '') + '</div>');
    $('#xCopy').addEventListener('click', function(){
      var ta = $('#tsv');
      var fallback = function(){ ta.focus(); ta.select(); toast('Selecciona el texto y cópialo'); };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(tsv).then(function(){ toast('Tabla copiada'); }, fallback); else fallback();
    });
    if (dl) $('#xCsv').addEventListener('click', function(){
      var head = [b.curso, b.area, b.trim, 'Unidad ' + b.unidad, 'Prof. ' + b.prof, 'Gestión ' + b.gestion].map(csvCell).join(';');
      var csv = '﻿' + head + '\r\n\r\n' + rows.map(function(r){ return r.map(csvCell).join(';'); }).join('\r\n');
      dl.save({filename: 'notas_' + slug(b.curso) + '_' + slug(b.trim) + '.csv', data: csv}).then(function(){ toast('Archivo guardado'); }, function(err){ if (!err || err.code !== 'declined') toast('No se pudo guardar el archivo'); });
    });
  }

  $('#bookBtn').addEventListener('click', openBooks);
  $('#bStu').addEventListener('click', openStudents);
  $('#bAct').addEventListener('click', function(){ openAct(null); });
  $('#bExp').addEventListener('click', openExport);
  $('#noteBtn').addEventListener('click', openStudents);

  /* ---------- inicio ---------- */
  try { var raw = localStorage.getItem(LS); if (raw) S = JSON.parse(raw); } catch(e){}
  if (!S || !S.books || !S.books.length) S = sample();
  render();

  if (!window.claude){
    dl = {save: function(o){
      return new Promise(function(res, rej){
        try {
          var a = document.createElement('a'), u = URL.createObjectURL(new Blob([o.data], {type: 'text/csv;charset=utf-8'}));
          a.href = u; a.download = o.filename; document.body.appendChild(a); a.click();
          setTimeout(function(){ URL.revokeObjectURL(u); a.remove(); }, 1000); res({status: 'saved'});
        } catch(e){ rej(e); }
      });
    }};
  }
  var C = window.claude;
  if (C && C.use){
    C.use('downloads').then(function(d){ dl = d || null; }, function(){});
    Promise.all([C.use('user'), C.use('db')]).then(function(r){
      var user = r[0], db = r[1];
      if (!user || !db){ setStatus('Solo en este teléfono'); return; }
      return user.id().then(function(id){
        if (!id){ setStatus('Solo en este teléfono'); return; }
        dbDoc = db.doc('data/users/' + id + '/book');
        return dbDoc.get().then(function(snap){
          var d = snap.exists ? snap.data() : null;
          if (d && d.data && d.data.books && d.data.books.length && (S.sample || (d.updatedAt || 0) > (S.updatedAt || 0))){
            S = d.data; saveLocal(); render(); setStatus('Guardado');
          } else if (!S.sample && (S.updatedAt || 0) > ((d && d.updatedAt) || 0)){
            dirty = true; flush();
          } else setStatus('Guardado');
        });
      });
    }).catch(function(){ setStatus('Solo en este teléfono'); });
  } else setStatus('Solo en este teléfono');
})();
</script>

</body>
</html>
